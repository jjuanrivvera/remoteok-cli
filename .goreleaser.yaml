# .goreleaser.yaml — remoteok release pipeline (cliwright GOAL.md §5).

version: 2

before:
  hooks: [go mod tidy, ./scripts/completions.sh]

builds:
  - id: remoteok
    main: ./cmd/remoteok
    binary: remoteok
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/version.Version={{ .Version }}
      - -X {{ .ModulePath }}/internal/version.Commit={{ .Commit }}
      - -X {{ .ModulePath }}/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    files: [README.md, LICENSE, completions/*]

checksum: { name_template: checksums.txt }

dockers:
  - id: remoteok
    ids: [remoteok]
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "ghcr.io/jjuanrivvera/remoteok-cli:{{ .Version }}"
      - "ghcr.io/jjuanrivvera/remoteok-cli:v{{ .Major }}"
      - "ghcr.io/jjuanrivvera/remoteok-cli:latest"
    build_flag_templates:
      - "--label=org.opencontainers.image.title=remoteok"
      - "--label=org.opencontainers.image.description=A read-only CLI for the Remote OK jobs API"
      - "--label=org.opencontainers.image.source=https://github.com/jjuanrivvera/remoteok-cli"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.licenses=MIT"

# An explicit release block — without it, `goreleaser check` errors on a fresh repo
# ("scm releases: no remote configured to list refs from").
release:
  github: { owner: jjuanrivvera, name: remoteok-cli }
  prerelease: auto

# Homebrew: use homebrew_casks (NOT the deprecated brews:). The cask is remoteok-cli,
# but the binary inside the archive is remoteok — so `binaries:` (plural list) is required,
# and an unsigned arm64 binary is SIGKILL'd by Gatekeeper without the xattr postflight.
homebrew_casks:
  - name: remoteok-cli
    binaries: [remoteok]
    repository: { owner: jjuanrivvera, name: homebrew-remoteok-cli, token: "{{ .Env.HOMEBREW_TAP_TOKEN }}" }
    homepage: https://github.com/jjuanrivvera/remoteok-cli
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/remoteok"]

scoops:
  - repository: { owner: jjuanrivvera, name: scoop-remoteok-cli, token: "{{ .Env.HOMEBREW_TAP_TOKEN }}" }

nfpms:
  - formats: [deb, rpm, apk]
    bindir: /usr/bin
    maintainer: jjuanrivvera
    contents:
      - { src: completions/remoteok.bash, dst: /usr/share/bash-completion/completions/remoteok }
      - { src: completions/remoteok.zsh,  dst: /usr/share/zsh/site-functions/_remoteok }
      - { src: completions/remoteok.fish, dst: /usr/share/fish/vendor_completions.d/remoteok.fish }

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]

changelog:
  groups:
    - { title: Features, regexp: '^.*?feat(\(.+\))??!?:.+$', order: 0 }
    - { title: Fixes, regexp: '^.*?fix(\(.+\))??!?:.+$', order: 1 }
    - { title: Performance, regexp: '^.*?perf(\(.+\))??!?:.+$', order: 2 }
  filters:
    exclude: ['^docs:', '^test:', '^chore:', '^ci:', merge conflict, Merge pull request, Merge branch]
